/* Date comparison / baseline vs current forecast: restrained planning-first typography */
.project-comparison{background:#fff;border:1px solid #e5ebe4;border-radius:20px;padding:24px;margin:0 0 23px;box-shadow:var(--shadow)}
.comparison-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.comparison-card{border:1px solid #e3eae2;border-radius:16px;padding:18px 20px;background:#fafbf8}
.comparison-caption{color:#7e9488;letter-spacing:.13em;font-size:10px;font-weight:700;margin-bottom:18px}
.comparison-dates{display:grid;grid-template-columns:minmax(0,1fr) 22px minmax(0,1fr);align-items:center;gap:14px}
.comparison-dates small{display:block;color:#8b9d94;letter-spacing:.07em;font-size:10px;font-weight:600;margin-bottom:8px}
.comparison-dates strong{display:block;font-family:Georgia,serif;font-size:22px;font-weight:500;color:#314f42;letter-spacing:-.03em;white-space:nowrap}
.compare-arrow{font-size:22px;font-weight:300;color:#b4c0b5}
.comparison-bottom{display:flex;align-items:center;gap:12px;margin-top:20px;padding-top:14px;border-top:1px solid #edf1eb}
.comparison-bottom>span:last-child{font-size:11px;color:#899a90}
.comparison-note{font-size:11px;line-height:1.7;color:#93a096;margin-top:13px}
.date-delta{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;gap:3px;font:650 11px/1.35 "Segoe UI",Arial,sans-serif;border-radius:8px;padding:5px 8px;background:#f2f5f1;color:#6f8275;letter-spacing:0}
.date-delta.delta-late{background:#f9eae6;color:#a45e51}
.date-delta.delta-early{background:#e7f3eb;color:#487a5f}
.date-delta.delta-on{background:#eaf1eb;color:#5e8771}
.date-delta.delta-missing{background:#f4f5f4;color:#a4aea8}
.kpi .value .date-delta{font-size:25px;font-family:Georgia,serif;font-weight:500;border-radius:0;background:transparent;padding:0;white-space:normal}
.kpi.accent .value .date-delta{color:#fff!important}
.milestone-toolbar{display:flex;gap:12px;align-items:center;margin:18px 0 15px;flex-wrap:wrap}
.milestone-toolbar input{flex:1;min-width:240px}
.milestone-count{color:#91a098;font-size:11px;margin-left:auto}
.milestone-comparison{border:1px solid var(--line);border-radius:19px;background:#fff;overflow-x:auto;box-shadow:var(--shadow)}

function getStatus(prj=p()){const counts={Completed:0,'In Progress':0,'Not Started':0};for(const t of prj.tasks)counts[t.status]=(counts[t.status]||0)+1;return counts;}
function averageActual(items){if(!items.length)return null;return items.reduce((a,t)=>a+(t.actual||0),0)/items.length;}
function avgPlanned(items){const withN=items.filter(t=>t.planned!==null&&t.planned!==undefined);return withN.length?withN.reduce((a,t)=>a+t.planned,0)/withN.length:null;}
function weightedOf(items,which){const valid=items.filter(t=>t.budget>0);const s=valid.reduce((a,t)=>a+t.budget,0);return s>0?valid.reduce((a,t)=>a+t.budget*((which==='plan'?t.planned:t.actual)||0)/100,0)/s*100:null;}
function milestones(prj=p()){const special=/notice to proceed|project completion|final handover|site mobilisation complete|design brief|design completion|permit approval|ifc drawing|permanent power|long.lead|structural works completion|envelope completion|testing and commissioning completion|mep installation completion|external works completion|handover date|start of engineering|completion of engineering|construction completion|completion of construction|substantial completion|practical completion|t.o.c|taking.over|milestone/i;let out=prj.tasks.filter(t=>special.test(t.name));if(out.length<5)out=prj.tasks.filter(t=>/completion|commencement|hand.over|notice to proceed/i.test(t.name)).slice(0,35);const uniq=new Map();for(const t of out)if(!uniq.has(t.name.toLowerCase()))uniq.set(t.name.toLowerCase(),t);return [...uniq.values()].sort((a,b)=>(a.finish||a.start||'').localeCompare(b.finish||b.start||''));}

/* A PM monitoring snapshot. Uses imported P6 dates; never re-schedules or claims actual daily history. */
function ovBase(pr=p()){const q=S.ovSearch.trim().toLowerCase();return pr.tasks.filter(t=>(!S.ovPhase||phase(t,pr)===S.ovPhase)&&(!S.ovWbs||t.wbs===S.ovWbs||t.wbs.startsWith(S.ovWbs+'.'))&&(!S.ovStatus||t.status===S.ovStatus)&&(!S.ovCritical||(t.float!==null&&t.float<=0))&&(!q||(t.id+' '+t.name+' '+t.wbs+' '+(pr.wbsNames[t.wbs]||'')).toLowerCase().includes(q)));}
const ovNotDone=t=>t.status!=='Completed';
function ovInWindow(t){if(!S.ovRef||!t.finish||!t.start||!ovNotDone(t))return false;const a=T(S.ovRef),b=a+S.ovDays*dayMs;return T(t.start)<=b&&T(t.finish)>=a;}
function ovOverdue(t){return !!(S.ovRef&&ovNotDone(t)&&t.finish&&T(t.finish)<T(S.ovRef));}
function ovFlag(t,key){const d=finishDelta(t);switch(key){case'late':return d>0;case'late7':return d>=1&&d<=7;case'late30':return d>=8;case'late8to30':return d>=8&&d<=30;case'late31':return d>30;case'early':return d<0;case'on':return d===0;case'missing':return d===null;case'negative':return t.float!==null&&t.float<0;case'critical':return t.float!==null&&t.float<=0;case'overdue':return ovOverdue(t);case'lookahead':return ovInWindow(t);case'pending':return ovNotDone(t);case'completed':return t.status==='Completed';case'inprogress':return t.status==='In Progress';case'notstarted':return t.status==='Not Started';case'milestones':return milestones(p()).some(m=>m.id===t.id);default:return true;}}
function ovCohort(pr=p()){const base=ovBase(pr);return S.ovRisk==='all'?base:base.filter(t=>ovFlag(t,S.ovRisk));}
function ovWatchScore(t){const d=finishDelta(t)||0;const days=S.ovRef&&t.finish?Math.round((T(t.finish)-T(S.ovRef))/dayMs):null;return (ovOverdue(t)?100:0)+(t.float!==null&&t.float<0?50+Math.min(60,Math.abs(t.float)):0)+(d>0?Math.min(75,d):0)+(ovInWindow(t)?25:0)+(days!==null&&days>=0&&days<=7?18:0)+(t.status==='In Progress'?5:0);}
function ovWatch(arr){return arr.filter(t=>ovNotDone(t)&&(ovOverdue(t)||ovInWindow(t)||(t.float!==null&&t.float<0)||finishDelta(t)>0)).sort((a,b)=>ovWatchScore(b)-ovWatchScore(a)||(a.finish||'').localeCompare(b.finish||''));}
function ovBadge(t){if(ovOverdue(t))return '<span class="pm-flag red">PAST DUE</span>';if(t.float!==null&&t.float<0)return '<span class="pm-flag red">NEG. TF</span>';if(finishDelta(t)>0)return '<span class="pm-flag">LATE</span>';if(ovInWindow(t))return '<span class="pm-flag green">NEXT '+S.ovDays+'D</span>';return '<span class="pm-flag green">WATCH</span>';}
const ovLabels={all:'All activities',late:'Delayed finish',late7:'1–7 days late',late30:'8+ days late',late8to30:'8–30 days late',late31:'31+ days late',early:'Earlier than baseline',on:'On baseline',missing:'Missing baseline date',negative:'Negative P6 total float',critical:'Critical / TF ≤ 0',overdue:'Past-due unfinished activities',lookahead:'Lookahead activities',pending:'Unfinished activities',completed:'Completed activities',inprogress:'In-progress activities',notstarted:'Not-started activities',milestones:'Milestone activities',watch:'PM attention list'};

function ovRenderDrawer(){const data=ovDrillItems(),label=ovLabels[S.ovDrill]||'Activities';const shown=data.slice(0,S.ovDrillLimit);$('#overlays').innerHTML=`<div class="drawer-mask" data-action="close-drawer"></div><aside class="drawer"><button class="drawer-close" data-action="close-drawer">×</button><div class="eyebrow">PM MONITORING · DRILL-DOWN</div><h2>${esc(label)}</h2><div class="pm-drawer-summary">${fmt(data.length)} matching activities · ${esc(p().title)} · Reference date ${shortDate(S.ovRef)}</div><div class="pm-drill-toolbar"><span class="tag">Live filter selection</span><button class="btn outline tiny" data-action="ov-export">${ico('download')} Export list</button></div><div class="pm-drill-list">${shown.map(t=>`<button class="pm-drill-item" data-activity="${esc(t.id)}"><strong>${esc(t.name)}</strong><small>${esc(t.id)} · ${esc(phase(t))} · ${esc(t.status)}</small><div class="pm-drill-meta"><span>BL ${shortDate(t.blFinish)} → FC ${shortDate(t.finish)}</span>${deltaHtml(finishDelta(t))}<span>TF ${t.float===null?'—':fmt(t.float)+'d'}</span></div></button>`).join('')||'<div class="no-data">No activities match this selection.</div>'}${shown.length<data.length?`<button class="btn outline" data-action="ov-more" style="width:100%;margin-top:9px">Show ${Math.min(40,data.length-shown.length)} more</button>`:''}</div><div class="pm-stale-warning">The list reflects the imported P6 snapshot. Past-due checks use the chosen reference date, which is not asserted to be the P6 Data Date. Negative float is a separate schedule indicator.</div></aside>`;}

function overview(){const pr=p(),window=windowInfo(pr),cohort=ovCohort(pr),n=cohort.length,comparable=cohort.filter(t=>finishDelta(t)!==null),late=comparable.filter(t=>finishDelta(t)>0),overdue=cohort.filter(ovOverdue),negative=cohort.filter(t=>t.float!==null&&t.float<0),near=cohort.filter(ovInWindow),unfinished=cohort.filter(ovNotDone);return head('SCHEDULE MONITORING · LIVE DRILL-DOWNS',esc(pr.title),`Interactive project monitoring from the imported Primavera snapshot. Filter, identify exceptions and open the supporting activities.`,`<span class="meta-pill">${esc(pr.filename)}</span>`)+ovToolbar()+`<div class="pm-metrics">${ovMetric('ACTIVITIES IN VIEW',fmt(n),`${fmt(unfinished.length)} unfinished · click for list`,'all')}${ovMetric('DELAYED FINISHES',fmt(late.length),`${comparable.length} comparable BL / forecast dates`,'late','red')}${ovMetric('NEGATIVE FLOAT',fmt(negative.length),'P6 TF < 0 · not the same as delay','negative','amber')}${ovMetric('PAST-DUE / UNFINISHED',fmt(overdue.length),`As of ${shortDate(S.ovRef)} · editable`,'overdue','red')}${ovMetric('LOOKAHEAD WINDOW',fmt(near.length),`In progress / scheduled across the next ${S.ovDays} days`,'lookahead')}${ovMetric('IN PROGRESS',fmt(cohort.filter(t=>t.status==='In Progress').length),'Click for active site work','inprogress')}${ovMetric('COMPLETED',fmt(cohort.filter(t=>t.status==='Completed').length),'Completed activities in selection','completed')}${ovMetric('MISSING BL FINISH',fmt(cohort.filter(t=>!t.blFinish||!t.finish).length),'Uncomparable dates for review','missing')}</div>`+comparisonStrip(pr)+`<div class="pm-hero">${ovPhasePanel(cohort)}${ovWatchPanel(cohort)}</div><div class="pm-two-col">${ovVariancePanel(cohort)}${ovStatusPanel(cohort)}</div>${ovMilestonePanel(cohort)}<div class="foot-source">Source: ${esc(pr.filename)} · ${pr.tasks.length} imported activities and ${pr.links.length} links. Date shifts are calendar days. PM flags are rule-based screenings, not causes of delay. The app does not recalculate P6 or maintain an actual progress history.</div>`;}

function monthAxis(start,end,trackWidth){const startms=T(start),endms=T(end),span=Math.max(dayMs,endms-startms);let first=new Date(startms);first=new Date(Date.UTC(first.getUTCFullYear(),first.getUTCMonth(),1));let list=[];while(first.getTime()<=endms&&list.length<60){const x=clamp((first.getTime()-startms)/span*100,0,100);const next=new Date(Date.UTC(first.getUTCFullYear(),first.getUTCMonth()+1,1));const xx=clamp((next.getTime()-startms)/span*100,0,100);list.push({x,w:Math.max(0,xx-x),d:first.toISOString().slice(0,10)});first=next;}return list;}

function chartCurve(pr){if(!pr.costTotal)return '';const start=T(pr.tasks.map(t=>t.blStart).filter(Boolean).sort()[0]),end=T(pr.tasks.map(t=>t.blFinish).filter(Boolean).sort().slice(-1)[0]);const span=Math.max(dayMs,end-start),data=[];for(let i=0;i<=48;i++){const d=start+(i/48)*span;let val=0;for(const t of pr.tasks){if(!(t.budget>0)||!t.blStart||!t.blFinish)continue;const a=T(t.blStart),b=T(t.blFinish)+dayMs;val+=t.budget*clamp((d-a)/(b-a),0,1);}data.push({x:i/48,y:val/pr.costTotal*100});}const W=770,H=306,px=50,py=26,rw=W-px-22,rh=H-py-42;const path=data.map((q,i)=>`${i?'L':'M'}${(px+q.x*rw).toFixed(1)} ${(py+(100-q.y)/100*rh).toFixed(1)}`).join(' ');const area=path+` L${px+rw} ${py+rh} L${px} ${py+rh} Z`;const mb=monthAxis(new Date(start).toISOString().slice(0,10),new Date(end).toISOString().slice(0,10));let point='';if(S.asOf&&T(S.asOf)>=start&&T(S.asOf)<=end){const x=px+(T(S.asOf)-start)/span*rw;const y=py+(100-pr.earnedTotal/pr.costTotal*100)/100*rh;point=`<line x1="${x}" x2="${x}" y1="${py}" y2="${py+rh}" stroke="#ba8f73" stroke-dasharray="5,5" opacity=".75"/><circle cx="${x}" cy="${y}" r="7" fill="#b5886b" stroke="white" stroke-width="3"/><text x="${Math.min(W-130,x+13)}" y="${y-12}" font-size="12" font-weight="700" fill="#a77559">EV ${pct(pr.earnedTotal/pr.costTotal*100)}</text>`;}const ticks=[0,25,50,75,100].map(v=>{const y=py+(100-v)/100*rh;return `<line x1="${px}" x2="${px+rw}" y1="${y}" y2="${y}" stroke="#e4ece3"/><text class="curve-ticks" x="${px-15}" y="${y+4}" text-anchor="end">${v}%</text>`;}).join('');const dates=[0,.25,.5,.75,1].map(u=>{const d=new Date(start+u*span).toISOString().slice(0,10);return `<text class="curve-ticks" x="${px+u*rw}" y="${H-12}" text-anchor="middle">${month(d)} ${d.slice(2,4)}</text>`;}).join('');return `<div class="curve-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Indicative linearly-spread cumulative planned budget curve">${ticks}<path d="${area}" fill="#dcebe0" opacity=".78"/><path d="${path}" fill="none" s async function importSchedule(file){if(!file)return;const lower=file.name.toLowerCase();toast('Reading '+file.name+' ...');try{let data;if(lower.endsWith('.json')){const json=JSON.parse(await file.text());data=Array.isArray(json)?json[0]:json;if(!Array.isArray(data.tasks))throw Error('This JSON is not a saved schedule dataset.');data.id='UPLOAD-'+(projects.length+1);data.filename=file.name;}else if(lower.endsWith('.csv'))data=parseTable([{name:'Activities',rows:parseCSV((await file.text()).replace(/^\ufeff/,''))}],file.name);else if(lower.endsWith('.xlsx')||lower.endsWith('.xlsm'))data=parseTable(await parseXlsx(await file.arrayBuffer()),file.name);else throw Error('Please select .xlsx, .xlsm, .csv or .json.');prepare(data);projects.push(data);S.ovPhase='';S.ovWbs='';S.ovStatus='';S.ovRisk='all';S.ovSearch='';S.ovCritical=false;S.pid=data.id;S.view='overview';S.query='';S.wbs='';S.status='';S.critical=false;S.asOf='';S.limit=80;$('#projectSelect').innerHTML=projects.map(x=>`<option value="${esc(x.id)}">${esc(x.title)}</option>`).join('');$('#projectSelect').value=data.id;render();toast(`Imported ${data.tasks.length} activities and ${data.links.length} links from ${file.name}.`);window.scrollTo(0,0);}catch(err){console.error(err);toast('Could not import: '+err.message,true);}}

document.addEventListener('click',e=>{const phaseBtn=e.target.closest('[data-ov-phase]');if(phaseBtn){S.ovPhase=S.ovPhase===phaseBtn.dataset.ovPhase?'':phaseBtn.dataset.ovPhase;render();return;}const statusBtn=e.target.closest('[data-ov-status]');if(statusBtn){S.ovStatus=S.ovStatus===statusBtn.dataset.ovStatus?'':statusBtn.dataset.ovStatus;render();return;}const dayBtn=e.target.closest('[data-ov-days]');if(dayBtn){S.ovDays=Number(dayBtn.dataset.ovDays);render();return;}const ovDrill=e.target.closest('[data-ov-drill]');if(ovDrill){ovOpen(ovDrill.dataset.ovDrill);return;}const nav=e.target.closest('[data-view]');if(nav){setView(nav.dataset.view);return;}const t=e.target.closest('[data-activity]');if(t){activityDetail(t.dataset.activity);return;}const proj=e.target.closest('[data-project]');if(proj){switchProject(proj.dataset.project);return;}const sort=e.target.closest('[data-sort]');if(sort){if(S.sort===sort.dataset.sort)S.desc=!S.desc;else{S.sort=sort.dataset.sort;S.desc=false;}render();return;}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='ov-reset'){S.ovPhase='';S.ovWbs='';S.ovStatus='';S.ovRisk='all';S.ovSearch='';S.ovCritical=false;render();}if(a==='ov-export')ovExport();if(a==='ov-more'){S.ovDrillLimit+=40;ovRenderDrawer();}if(a==='export')exportCsv();if(a==='reset'){S.query='';S.wbs='';S.status='';S.critical=false;S.dateShift='all';S.limit=80;render();}if(a==='more'){S.limit+=80;render();}if(a==='close-drawer')$('#overlays').innerHTML='';if(a==='browse')$('#importFile').click();if(a==='download-json')downloadJson();if(a==='pres-exit')endPresentation();if(a==='pres-next'){S.pres=clamp(S.pres+1,0,5);drawPresentation();}if(a==='pres-prev'){S.pres=clamp(S.pres-1,0,5);drawPresentation();}});
document.addEventListener('change',e=>{if(e.target.id==='ovPhase'){S.ovPhase=e.target.value;render();}if(e.target.id==='ovStatus'){S.ovStatus=e.target.value;render();}if(e.target.id==='ovRisk'){S.ovRisk=e.target.value;render();}if(e.target.id==='ovWbs'){S.ovWbs=e.target.value;render();}if(e.target.id==='ovRef'){S.ovRef=e.target.value;render();}if(e.target.id==='ovCritical'){S.ovCritical=e.target.checked;render();}if(e.target.id==='projectSelect')switchProject(e.target.value);if(e.target.id==='wbsFilter'){S.wbs=e.target.value;S.limit=80;render();}if(e.target.id==='statusFilter'){S.status=e.target.value;S.limit=80;render();}if(e.target.id==='shiftFilter'){S.dateShift=e.target.value;S.limit=80;render();}if(e.target.id==='criticalFilter'){S.critical=e.target.checked;S.limit=80;render();}if(e.target.id==='asOfInput'){S.asOf=e.target.value;render();}if(e.target.id==='importFile'){importSchedule(e.target.files?.[0]);e.target.value='';}});
let searchTick;document.addEventListener('input',e=>{if(e.target.id==='ovSearch'){S.ovSearch=e.target.value;clearTimeout(searchTick);searchTick=setTimeout(render,200);}if(e.target.id==='searchInput'){S.query=e.target.value;S.limit=80;clearTimeout(searchTick);searchTick=setTimeout(render,120);}});
document.addEventListener('keydown',e=>{if(!$('#presentation')){if(e.key==='Escape'&&$('.drawer'))$('#overlays').innerHTML='';return;}if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();S.pres=clamp(S.pres+1,0,5);drawPresentation();}if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();S.pres=clamp(S.pres-1,0,5);drawPresentation();}if(e.key==='Escape')endPresentation();});
document.addEventListener('dragover',e=>{if(e.target.closest('#uploadZone')){e.preventDefault();e.target.closest('#uploadZone').classList.add('dragover');}});
document.addEventListener('dragleave',e=>{if(e.target.closest('#uploadZone'))e.target.closest('#uploadZone').classList.remove('dragover');});
document.addEventListener('drop',e=>{const zone=e.target.closest('#uploadZone');if(zone){e.preventDefault();zone.classList.remove('dragover');importSchedule(e.dataTransfer.files?.[0]);}});
shell();
})();
</script></body></html>
